name: metal-research

# How iOS 16's Metal.framework finds its GPU driver (for the A01 Core's own Metal driver).
# Reads the iPhone X (D22AP) 16.7.16 dyld shared cache with blacktop/ipsw and prints only
# strings and symbol names around driver discovery. No Apple binary is stored or uploaded.

on:
  push:
    branches: [a01core]
    paths:
      - ".github/workflows/metal-research.yml"
  workflow_dispatch:
    inputs:
      device:
        default: "iPhone10,3"
      version:
        default: "16.7.16"

jobs:
  research:
    runs-on: macos-15-intel   # mounts the APFS system DMG natively
    timeout-minutes: 90
    steps:
      - name: Install ipsw
        run: |
          set -e
          url=$(curl -sf https://api.github.com/repos/blacktop/ipsw/releases/latest | python3 -c "
          import sys, json
          a = [x['browser_download_url'] for x in json.load(sys.stdin)['assets']]
          m = [u for u in a if 'macOS' in u and ('universal' in u or 'x86_64' in u) and u.endswith('.tar.gz') and 'frida' not in u and '/ipswd' not in u and 'ipswd_' not in u]
          print(m[0])")
          echo "$url"; curl -sfL -o ipsw.tgz "$url" && tar xzf ipsw.tgz && sudo mv "$(find . -maxdepth 2 -name ipsw -type f | head -1)" /usr/local/bin/ipsw && ipsw version
      - name: Extract the dyld shared cache (remote)
        run: |
          mkdir -p dsc && cd dsc
          ipsw download ipsw --device "${{ inputs.device || 'iPhone10,3' }}" --version "${{ inputs.version || '16.7.16' }}" --dyld -y \
            || { ipsw download ipsw --help | head -80; exit 1; }
          find . -name 'dyld_shared_cache_arm64*' | head
      - name: Metal driver discovery
        run: |
          set +e
          DSC=$(find dsc -name 'dyld_shared_cache_arm64' -o -name 'dyld_shared_cache_arm64e' | grep -v '\.' | head -1)
          [ -z "$DSC" ] && DSC=$(find dsc -name 'dyld_shared_cache_arm64*' | grep -v '\.[0-9]' | head -1)
          echo "DSC: $DSC"
          for s in MetalPluginName MetalPluginClassName MetalStatisticsName IOGLESBundleName AGXMetal \
                   /System/Library/Extensions IOAcceleratorES IOGPU IOAccelerator AGXPrincipalDevice \
                   MTLCopyAllDevices MTLCreateSystemDefaultDevice IOGPUDeviceCreate MTLDeviceClass; do
            echo "=== str: $s"; ipsw dyld str "$DSC" "$s" 2>&1 | head -25
          done
          for img in Metal IOGPU QuartzCore; do
            echo "=== $img strings (driver/plugin related)"
            ipsw dyld macho "$DSC" "$img" --strings 2>&1 | grep -iE 'plugin|bundle|extension|agx|accel|iogpu|principal|registry|device' | head -120
            echo "=== $img symbols (device creation)"
            ipsw dyld macho "$DSC" "$img" --symbols 2>&1 | grep -iE 'CreateSystemDefaultDevice|CopyAllDevices|Plugin|Bundle|IOGPUDevice|AcceleratorES|DeviceCreate' | head -80
          done
      - name: Metal plugin class lookup (disassembly)
        run: |
          set +e
          DSC=$(find dsc -name 'dyld_shared_cache_arm64' | head -1)
          for sym in _getMetalPluginClassForService '__ZL24MTLDeviceArrayInitializev' ___MTLCreateSystemDefaultDevice_block_invoke; do
            echo "=== disass $sym"
            ipsw dyld disass "$DSC" --symbol "$sym" 2>&1 | grep -v "parsing\|Saving\|Loading" | head -260
          done
          echo "=== Metal symbols: MTLDeviceArray / addDevice"
          ipsw dyld macho "$DSC" Metal --symbols 2>&1 | grep -iE 'DeviceArray|MTLAddDevice|registerDevice|getMetalPlugin' | head -40
