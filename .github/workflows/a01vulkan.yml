name: a01vulkan

# Mesa PowerVR Vulkan (pvr) for the Galaxy A01 Core's iOS userland (gpu/a01vulkan).

on:
  workflow_dispatch:
  push:
    branches: [a01core]
    paths:
      - "gpu/a01vulkan/**"
      - "gpu/mesa/patch-mesa.py"
      - ".github/workflows/a01vulkan.yml"

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Deps
        run: |
          brew install meson ninja bison pkg-config llvm spirv-llvm-translator spirv-tools libclc || true
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q mako pyyaml packaging setuptools meson
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
      - name: Build
        run: |
          set -o pipefail
          bash gpu/a01vulkan/build-pvr.sh "$RUNNER_TEMP/w" out 2>&1 | tee build.log
      - name: Errors as annotations
        if: failure()
        run: |
          grep -E "error:|FAILED:|ERROR:" build.log | sort -u | head -40 | while read -r l; do echo "::error::${l:0:400}"; done
      - uses: actions/upload-artifact@v4
        with:
          name: a01vulkan
          path: out/
